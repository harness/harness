name: CI Linter pipeline
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read

jobs:
  web:
    name: CI linter for js/ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn" 
          cache-dependency-path: web/yarn.lock
      - name: install, lint, and build web app
        working-directory: web
        continue-on-error: true
        run: |
          yarn install
          yarn check:all
          yarn build

  gitness:
    name: CI linter for go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0' # Alinhado com o go.mod atualizado e com o binário do golangci-lint
          cache: true
          cache-dependency-path: go.sum
      - name: get dependencies
        run: |
          mkdir -p ./web/dist
          touch ./web/dist/empty.txt
          # Sincroniza e limpa as dependências do módulo para o Go 1.24, resolvendo o erro de contexto
          go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        env:
          GOGC: "10" # Coletor de lixo agressivo para economizar memória do runner
          GOMEMLIMIT: "4GiB" # Deixa margem segura para o sistema do GitHub não matar o processo
        with:
          version: v1.64 # Versão estável com correções de performance e suporte nativo ao Go 1.24
          # Adicionado o modo readonly para ler a árvore de módulos limpa pelo go mod tidy
          args: --timeout=30m --concurrency=2 --modules-download-mode=readonly ./...
