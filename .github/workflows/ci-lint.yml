  gitness:
    name: CI linter for go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true
          cache-dependency-path: go.sum
      - name: get dependencies
        run: |
          mkdir -p ./web/dist
          touch ./web/dist/empty.txt
          # Força a sincronização e limpeza dos módulos para o Go 1.24 antes do linter rodar:
          go mod tidy
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        env:
          GOGC: "10"
          GOMEMLIMIT: "4GiB"
        with:
          version: v1.64
          # Adicionamos a flag --modules-download-mode=readonly para o linter respeitar o tidy anterior
          args: --timeout=30m --concurrency=2 --modules-download-mode=readonly ./...
