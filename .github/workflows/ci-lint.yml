name: CI & MEA Autonomous Pipeline

on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  web:
    name: CI linter for js/ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: "npm"
          cache-dependency-path: web/yarn.lock
      - name: install, lint, and build web app
        working-directory: web
        run: |
          yarn install
          yarn check:all
          yarn build

  gitness:
    name: CI linter for go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          # Ativa o cache nativo do Go para acelerar o processo
          cache: true
      - name: get dependencies
        run: |
          mkdir -p ./web/dist
          touch ./web/dist/empty.txt
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          skip-cache: false
          # Força o linter a focar apenas nos pacotes locais, liberando memória
          args: --timeout=5m --concurrency=2 --build-tags="" ./...

  mea-autonomous-sentry:
    name: MEA Quantum Sentry Autonomous Audit
    needs: [web, gitness]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MEA Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx fastapi uvicorn cryptography sentence-transformers numpy redis mem0ai

      - name: Run MEA Autonomous Audit & Sentry Check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEA_MASTER_KEY: ${{ secrets.MEA_MASTER_KEY || 'chave_soberana_padrao' }}
          GIBBERLINK_MODE: 'json'
        run: |
          echo "🌌 [CI/CD] Acionando o Kernel Quântico da MEA na nuvem..."
          python -c "import mea; print(f'⚡ MEA Kernel Carregado com Sucesso! Versão: {mea.__version__}')"
          
          # Executa uma auto-auditoria estática via Guardian no commit atual
          python -c "from mea.guardian import GuardianEngine; import glob; [print(f'Auditando {f}:', GuardianEngine().verificar_integridade_sintatica(open(f, encoding='utf-8', errors='ignore').read(), f)) for f in glob.glob('mea/**/*.py', recursive=True)]"
