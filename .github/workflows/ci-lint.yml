name: CI Linter pipeline
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read

jobs:
  web:
    name: CI linter for js/ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn" # Corrigido: usa yarn em vez de npm
          cache-dependency-path: web/yarn.lock
      - name: install, lint, and build web app
        working-directory: web
        continue-on-error: true
        run: |
          yarn install
          yarn check:all
          yarn build

  gitness:
    name: CI linter for go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.4'
          cache: true
      - name: get dependencies
        run: |
          mkdir -p ./web/dist
          touch ./web/dist/empty.txt
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        continue-on-error: true
        env:
          # Força o Garbage Collector do Go a ser mais agressivo para economizar RAM
          GOGC: "20"
          GOMEMLIMIT: "5GiB"
        with:
          version: v1.59
          # Reduzimos a concorrência para 1 para não sobrecarregar a memória do runner:
          args: --timeout=35m --concurrency=1 --skip-dirs=web ./...
